# CI — the check a clean clone can run and Tom's machine cannot.
#
# The point is not "run the tests" (Tom runs them locally). It is to catch the
# class of defect where the repo only works because of state on one machine:
# an undeclared dependency, a file that exists on disk but not in git, a doc
# telling you to install the wrong manifest. Both of those had shipped —
# `requirements.txt` was missing hmmlearn and matplotlib, and pytest/ruff were
# undeclared entirely (2026-08-24).
#
# `uv` and not `pip` because `scripts/jobs/_env.bat` runs every scheduled job
# through `uv run`. CI must install the way production installs, or it is
# testing a build nobody ships.
name: CI

on:
  push:
    branches: [master, "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Pinned to the interpreter .venv actually runs (uv.lock resolves against
      # it). requires-python is >=3.11 and the tests pass on 3.11 too, but CI
      # should mirror one environment rather than average two.
      - run: uv python install 3.13

      - name: Install
        run: uv sync --frozen
        # --frozen: fail if uv.lock is out of date with pyproject.toml, rather
        # than silently resolving something new. A lockfile that CI updates for
        # you is a lockfile that never catches drift.

      - name: Lint
        run: uv run ruff check .
        continue-on-error: true
        # Non-blocking on purpose. There are 65 known findings (CLAUDE.md
        # §20.2); making them fatal today would block every PR on a backlog
        # nobody agreed to clear this week. Flip this off once the count is 0.

      - name: Tests
        run: uv run pytest tests/ -q
        env:
          # No test may reach the network — every vnstock/LLM path is faked
          # (tests/conftest.py, test_picks_universe_service.py). These are here
          # so a test that starts reaching out fails loudly instead of being
          # slow and flaky.
          TRADING_HALT: "0"
          API_REQUIRE_KEY: "0"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test

      # Build, not just test: the suite is 13 tests and would not notice a type
      # error in a page it does not render. `tsc -b` would.
      - run: npm run build
