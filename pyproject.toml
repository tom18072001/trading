[project]
name = "trading"
version = "1.0.0"
description = "VN Stock Market Analysis & Prediction System"
requires-python = ">=3.11"
# The only manifest. `uv sync` is the install command, and
# scripts/jobs/_env.bat runs every scheduled job through `uv run`, so this
# file plus uv.lock is literally what production executes.
#
# requirements.txt was deleted 2026-08-24. It was described here as a
# "human-readable mirror" but had drifted into a strict subset missing
# hmmlearn and matplotlib — i.e. the README's install command produced a
# machine that could not classify regime or render the report, and said so
# only when the 17:00 job ran. A second manifest nothing installs from is a
# second manifest nobody updates.
#
# weasyprint is intentionally absent: its import is guarded and PDF gen falls
# back to headless Chrome on Windows.
dependencies = [
    "vnstock>=3.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "hmmlearn>=0.3.0",
    "ta>=0.11.0",
    "tqdm>=4.65.0",
    "joblib>=1.3.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",
    "requests>=2.31.0",
    "matplotlib>=3.8.0",
    "yfinance>=0.2.40",
    "claude-agent-sdk>=0.1.0",
]

# The suite and the linter were undeclared until 2026-08-24 — they happened to
# be installed on Tom's machine, so `uv sync` on a fresh clone produced a repo
# whose tests could not run. CI is what forced the question.
#
# `httpx` is here rather than above because only FastAPI's TestClient needs it;
# nothing in the shipped code imports it.
[dependency-groups]
dev = [
    "pytest>=9.0",
    "anyio>=4.9",
    "httpx>=0.28",
    "ruff>=0.16",
]

[tool.setuptools]
packages = ["data", "analysis", "models", "database", "services", "api", "api.routers"]

[tool.uv]
# App-style repo: code runs from the project root (main.py, api/, services/).
# Without this, `uv sync` installs a frozen COPY of the package into
# site-packages which shadows live source for any process whose sys.path
# prefers site-packages — the server then executes stale code while the
# files on disk look correct (bug hunted 2026-07-19).
package = false


# ============================================================================
# ruff — added 2026-08-22 (review P3-5)
# ============================================================================
# Before this, `ruff check .` reported ~666 findings on default settings and
# nobody could tell signal from noise, so nobody ran it. The rules below are
# the ones that catch real defects in this codebase; cosmetic ones are off on
# purpose. Run `ruff check .` before committing — a clean run should mean
# something.
[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", ".venv-lin", "backup", "_trash_*", "frontend", "notebooks"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "W", "B", "C4", "PIE", "RET501", "PERF", "S"]
ignore = [
    "E701", "E702",   # this codebase uses one-line if/semicolons deliberately
    "S101",           # asserts are how the tests are written
    "S311",           # non-crypto randomness is fine for synthetic panels
    "B008",           # FastAPI Depends() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
# Report scripts are procedural top-to-bottom: imports land after the DB is
# opened, and broad excepts keep a scheduled job from dying mid-render.
# Renamed from generate_secv5.py on 2026-08-22 (CLAUDE.md §21); this key kept
# the old name, so the block had been inert ever since.
"generate_report.py" = ["E402", "S110", "S603", "S607"]
"scripts/*" = ["S101", "S603", "S607"]
"tests/*" = ["S105", "S106", "ARG"]
